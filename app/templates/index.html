<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background: white;
            margin: 10px 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        a {
            margin-left: 10px;
            text-decoration: none;
        }

        .delete {
            color: red;
        }
    </style>
</head>

<body>

    <h1>My To-Do List</h1>

    <form action="/add" method="POST">
        <input
            type="text"
            name="title"
            placeholder="Enter a task..."
            required
        >

        <button type="submit">
            Add Task
        </button>
    </form>

    <ul>

        {% for todo in todos %}

        <li>

            <span class="{% if todo.completed %}completed{% endif %}">
                {{ todo.title }}
            </span>

            <span>
                <a href="/complete/{{ todo.id }}">
                    {% if todo.completed %}
                        Undo
                    {% else %}
                        Complete
                    {% endif %}
                </a>

                <a
                    class="delete"
                    href="/delete/{{ todo.id }}"
                >
                    Delete
                </a>
            </span>

        </li>

        {% else %}

        <li>
            No tasks yet.
        </li>

        {% endfor %}

    </ul>

</body>

</html>
