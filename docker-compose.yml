services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: todo-app

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}

    expose:
      - "5000"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - todo-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3


  mysql:
    image: mysql:8.4

    container_name: todo-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - todo-mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "todo_user",
          "-ptodo_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - todo-network


  nginx:
    image: nginx:alpine

    container_name: todo-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - todo-network


networks:

  todo-network:
    driver: bridge


volumes:

  todo-mysql-data:
